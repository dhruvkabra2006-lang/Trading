name: Place Trade

on:
  push:
    paths:
      - 'trigger.json'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Execute trade
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: |
          python3 - <<'EOF'
          import urllib.request, json, os

          key    = os.environ["ALPACA_API_KEY"]
          secret = os.environ["ALPACA_API_SECRET"]
          base   = "https://paper-api.alpaca.markets/v2"

          headers = {
              "APCA-API-KEY-ID":     key,
              "APCA-API-SECRET-KEY": secret,
              "Content-Type":        "application/json",
          }

          def make_request(url, method="GET", data=None):
              body = json.dumps(data).encode() if data else None
              req  = urllib.request.Request(url, body, method=method)
              for k, v in headers.items():
                  req.add_header(k, v)
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read()) if resp.read() else {}

          with open("trigger.json") as f:
              params = json.load(f)

          action = params.get("action", "order")

          if action == "close_all":
              print("Closing all positions...")
              req = urllib.request.Request(f"{base}/positions", method="DELETE")
              for k, v in headers.items():
                  req.add_header(k, v)
              try:
                  with urllib.request.urlopen(req) as resp:
                      results = json.loads(resp.read())
                      if isinstance(results, list):
                          for r in results:
                              sym    = r.get("symbol", "?")
                              status = r.get("status", "?")
                              print(f"  Closed {sym} — {status}")
                          print(f"Done. {len(results)} position(s) closed.")
                      else:
                          print("No open positions to close.")
              except urllib.error.HTTPError as e:
                  body = e.read().decode()
                  print(f"Error {e.code}: {body}")

          else:
              symbol = params["symbol"]
              qty    = str(params["qty"])
              side   = params["side"]

              order = {
                  "symbol":        symbol,
                  "qty":           qty,
                  "side":          side,
                  "type":          "market",
                  "time_in_force": "day",
              }
              req = urllib.request.Request(
                  f"{base}/orders", json.dumps(order).encode(), method="POST"
              )
              for k, v in headers.items():
                  req.add_header(k, v)
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read())
                  print(f"Order placed!")
                  print(f"  ID:     {result['id']}")
                  print(f"  Symbol: {result['symbol']}")
                  print(f"  Qty:    {result['qty']}")
                  print(f"  Side:   {result['side']}")
                  print(f"  Status: {result['status']}")
          EOF
